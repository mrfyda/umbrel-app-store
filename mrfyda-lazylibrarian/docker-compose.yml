version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mrfyda-lazylibrarian_app_1
      APP_PORT: 5299

  app:
    image: lscr.io/linuxserver/lazylibrarian:latest@sha256:e167d819d7fc29d6210d9f9d6b5dae08fa4ebc49de27b184b47c287d8bc0047e
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/downloads:/downloads
      - ${APP_DATA_DIR}/data/books:/books
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
