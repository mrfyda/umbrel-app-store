version: "3.7"

services:
  app_proxy:
    environment:
      # Lazytainer owns the network namespace and is the only always-up
      # container here, so it is what the gateway resolves and connects to.
      APP_HOST: mrfyda-karaoke-eternal_lazytainer_1
      APP_PORT: 8080
      # The entire point of this app is that guests scan a QR code and open it
      # on their own phones. They have no Umbrel account, so Umbrel's login in
      # front of it would lock out everyone but the host. Karaoke Eternal's own
      # accounts and per-room passwords are the access control.
      PROXY_AUTH_ADD: "false"

  # ============================================================================
  # Lazytainer — the always-on gatekeeper
  # ============================================================================
  #
  # ⚠️ Needs the host's Docker socket to start and stop the app container,
  # which is effectively host root access. That is why this app is in a
  # personal store rather than the official Umbrel App Store.
  lazytainer:
    image: ghcr.io/vmorganp/lazytainer:sha-919abb2@sha256:c6c76d8534e9d74732e415e92401b3ca37a8274dad7b3496993a8f9def074149
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # On, because "why is this still awake?" is otherwise unanswerable. Every
      # poll then logs one of two lines, and they mean different things:
      #
      #   N active clients                      -> a socket is still open
      #   N packets received in the last 900s   -> traffic, but nobody attached
      #
      # Set it back to "false" once the answer is boring.
      VERBOSE: "true"
      # Lazytainer's ESTABLISHED-socket check is off unless this is set, and the
      # flag reads backwards. Its README documents IPV4_DISABLED / IPV6_DISABLED
      # as opt-in switches you set to "true" to turn a family off, but the code
      # only enables a family when the variable *exists* and is not "true":
      #
      #   if existsEnvDisableIpv4 && strings.ToLower(envIpv4) != "true" {
      #       ipv4Enabled = true
      #   } else { ipv4Enabled = false }     // <- unset lands here
      #
      # So with the variable absent, getActiveClients() inspects no sockets at
      # all and returns 0 forever, leaving packet counting as the only signal.
      # Setting it to "false" is what actually turns IPv4 counting on. Verified
      # against this image: one silent held connection on the watched port
      # reports "0 active clients" without it and "1 active clients" with it.
      #
      # IPv6 reading stays off, and on its own that would leave this check
      # useless here. The sysctl below is what puts the app's sockets in the
      # table Lazytainer actually reads.
      IPV4_DISABLED: "false"

    # Karaoke Eternal binds IPv6 only, so without this the socket check above
    # sees nothing at all.
    #
    # The server is `server.listen(env.KES_PORT)` with no host argument
    # (server/serverWorker.ts), and server/lib/cli.ts offers no bind address in
    # either its env vars or its CLI options, so the app cannot be asked for
    # IPv4. Node with no host binds `::` dual-stack, which puts the listener
    # and every IPv4-mapped client connection in /proc/net/tcp6 — and
    # getActiveClients() reads that table only when ipv6Enabled, which is off.
    # Measured on 2.0.2 with three connections held open on 8080: zero IPv4
    # entries, three IPv6 ESTABLISHED, "0 active clients" at every poll, and a
    # packet counter frozen at 256 throughout. Both stop conditions were
    # satisfied with three live connections attached, which is the exact
    # failure IPV4_DISABLED was set to prevent.
    #
    # Node tries `::` first and falls back to 0.0.0.0 when that bind fails, so
    # taking IPv6 out of the namespace is enough to move those sockets into
    # /proc/net/tcp. Lazytainer owns the namespace, so the sysctl belongs on
    # this service rather than on the app.
    #
    # This rather than IPV6_DISABLED="false", which also works on a host that
    # has IPv6: that makes netstat read /proc/net/tcp6, which is fatal where
    # there is none (vmorganp/Lazytainer#66), and a panicking Lazytainer takes
    # the app down with it because it holds the namespace. The cost of doing it
    # this way instead is that a kernel with IPv6 compiled out has no
    # /proc/sys/net/ipv6 for Docker to write, and this container then refuses
    # to start. That host never had the bug — Node would already have fallen
    # back to IPv4 by itself — so the trade is a loud failure on a box that did
    # not need the fix, against a silent one on every box that does.
    #
    # Dispatcharr needs none of this: its nginx opens a real 0.0.0.0:9191
    # socket beside [::]:9191, so its clients land in /proc/net/tcp and the
    # IPv4-only check there sees them.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

    labels:
      - "lazytainer.group.karaoke.ports=8080"
      # A party is exactly when you do not want this guessing wrong. Phones and
      # the player hold websockets open, and Lazytainer counts ESTABLISHED
      # sockets as well as packets, so an idle-but-connected room stays up;
      # 15 minutes covers the gap between the last phone disconnecting and the
      # next song night.
      - "lazytainer.group.karaoke.inactiveTimeout=900"
      - "lazytainer.group.karaoke.minPacketThreshold=1"
      - "lazytainer.group.karaoke.sleepMethod=stop"
      # Explicit, because two timings above are derived from it rather than
      # from inactiveTimeout, and both surprise you:
      #
      # Lazytainer keeps a rolling window of inactiveTimeout/pollRate packet
      # counts. The idle counter only advances once that whole window is quiet,
      # and only then does it need another inactiveTimeout of quiet to fire. So
      # after the app has actually been used, sleeping takes up to *twice*
      # inactiveTimeout — up to 30 minutes here, not 15. From a cold start the
      # window is already zeroed and 15 minutes is the real figure.
      #
      # minPacketThreshold=1 also reads stricter than it looks: the test is
      # "fewer than 1 packet in the whole window", so a single stray packet in
      # 15 minutes is enough to keep the app awake.
      - "lazytainer.group.karaoke.pollRate=30"

  # ============================================================================
  # Karaoke Eternal Server
  # ============================================================================
  server:
    image: radrootllc/karaoke-eternal:2.0.2@sha256:96a4ff5f14657aaa0e7308f1455fedab7065756e1e3e163522619ee3aa9f5c5f
    restart: on-failure

    network_mode: service:lazytainer
    depends_on:
      - lazytainer

    labels:
      - "lazytainer.group=karaoke"

    volumes:
      # Accounts, rooms, the song database and the session key.
      - ${APP_DATA_DIR}/data/config:/config
      # Media library. Add /mnt/karaoke under Media Folders in the app to scan
      # it. Point this somewhere roomier if the songs outgrow app-data — e.g.
      # ${UMBREL_ROOT}/home/Karaoke:/mnt/karaoke
      - ${APP_DATA_DIR}/data/media:/mnt/karaoke

    # LinuxServer-style image: starts as root, fixes ownership, then drops to
    # PUID:PGID. 1000:1000 is what Umbrel owns APP_DATA_DIR as. Do not add a
    # `user:` key — it would run before the image can fix permissions.
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
