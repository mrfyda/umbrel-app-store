manifestVersion: 1.1
id: mrfyda-karaoke-eternal
category: media
name: Karaoke Eternal
version: "2.0.2b"
tagline: Host karaoke parties where everyone queues songs from their phone
icon: https://raw.githubusercontent.com/mrfyda/umbrel-app-store/main/mrfyda-karaoke-eternal/icon.png
port: 8090
description: >-
  Everyone at the party opens the app on their own phone, searches the library
  and queues songs. The player is a browser tab too — put it fullscreen on
  whatever is wired to the TV and speakers. Plays MP3+G, zipped MP3+G and MP4,
  with music-synced WebGL visualizations behind the lyrics.


  Multiple rooms can run at once, each with its own queue and optional
  password, and guests join by scanning a QR code. No microphones needed: the
  player only outputs the music.


  Create the first admin account when you open the app. Then add /mnt/karaoke
  under Media Folders and scan.


  Songs go in ${APP_DATA_DIR}/data/media on the Umbrel host. Point that mount
  at a larger folder in docker-compose.yml if the library outgrows app-data.


  ⚠️ This app sleeps when idle. A Lazytainer sidecar stops the container after
  15 minutes with no traffic and starts it again on the next connection. The
  first request after it has slept will fail — umbrelOS shows "Oops, there was
  an error" — because nothing is listening yet. Wait a few seconds and reload.
  Once guests are connected their websockets keep it awake, so it will not
  sleep mid-party. Open it yourself before people arrive.


  ⚠️ Any browser tab left open on it keeps it awake indefinitely, including
  your own. The app holds a websocket for as long as its page is open and
  reconnects on its own, and a tab that is merely backgrounded still counts.
  If it never seems to sleep, that is almost always why: close the tabs. Note
  also that "15 minutes" is the figure from a cold start — after the app has
  actually been used it can take up to 30, because the traffic counter has to
  drain first.


  ⚠️ Umbrel's login is disabled for this app, because party guests scanning
  the QR code have no Umbrel account. Karaoke Eternal's own accounts and room
  passwords are what protect it — anyone on your network can reach the login
  page.


  ⚠️ Mounts the host's Docker socket, which is effectively host root access,
  so that Lazytainer can start and stop the app container. This is why the app
  is here and not in the official Umbrel App Store.
developer: Brandon Jones
website: https://www.karaoke-eternal.com
submitter: mrfyda
submission: https://github.com/mrfyda/umbrel-app-store
repo: https://github.com/bhj/KaraokeEternal
support: https://github.com/bhj/KaraokeEternal/issues
gallery: []
releaseNotes: >-
  2.0.2b adds no upstream code. The letter marks packaging-only changes made in
  this store; upstream is still 2.0.2.


  2.0.2a turned Lazytainer's open-connection check back on, and that turns out
  to have been necessary but not sufficient — the check was running and still
  seeing nothing. Karaoke Eternal's server binds IPv6 only: Node's listen()
  with no host argument takes "::", and the app has no setting to change it, so
  every connection lands in the kernel's IPv6 socket table while Lazytainer,
  deliberately configured not to read that table, went on reporting "0 active
  clients". Measured with three browser-equivalent connections held open on
  port 8080, it saw none of them.


  So the original risk was still live. A room of phones sitting quietly between
  songs generates almost no traffic, and with nothing holding the app up but
  packet counting it could still have been stopped underneath the party.


  The fix takes IPv6 away from the network namespace the sidecar and the app
  share. Node tries IPv6 first and falls back to IPv4 when that bind fails, so
  its sockets move into the table Lazytainer already reads, and connected
  guests now genuinely hold the app up. Nothing about how you reach the app
  changes — it was always served over IPv4.


  VERBOSE is still on if you want to watch it work: with a single tab open the
  log should now say "1 active clients" where it used to say 0.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
