releaseNotes: >-
  0.31.0a adds no upstream code. The letter marks packaging-only changes
  made in this store — the Valkey sidecar, the Lazytainer fix and the new
  icon, all described at the end of these notes. Upstream is still 0.31.0.


  Upstream 0.31.0. The most useful part here is logging: container output is
  collected into one stream, and System → Logs lists, filters and downloads
  it from the browser. That matters for this packaging, where the app is a
  single container and Umbrel gives you no shell to tail it from. Optional
  on-disk persistence writes to /data/logs, inside the volume this app
  already keeps.


  Also in this release: recordings can transcode through a DVR output
  profile and use broadcast-date placeholders in path templates, admins can
  restrict a user's Redirect sources to an allowlist of provider profiles,
  the TV Guide loads past the old 24-hour cap as you scroll, failed M3U and
  EPG refreshes raise system events instead of failing silently, and the
  channel and stream tables go up to 500 rows a page.


  Worth knowing on a small host: UWSGI_WORKERS and CELERY_MAX_WORKERS are
  now tunable, defaulting to 4 and 6. Lowering them in docker-compose.yml
  trades throughput for memory on a Raspberry Pi.


  Security: Django 6.0.7 → 6.0.8, fixing a high-severity server-side
  file-write and request forgery (CVE-2026-15307) and three lesser issues,
  with further fixes in djangorestframework, cryptography, pillow and
  yt-dlp. DVR recording paths are now confined to /data/recordings, and
  rebuilding stream hashes is admin-only.


  Packaging fix in this store: Redis now runs as its own container rather than
  the one bundled in the app image. The bundled binary's jemalloc is built for
  4 KiB pages and segfaults on a host with larger ones — a Raspberry Pi 5 on
  Raspberry Pi OS, whose kernel uses 16 KiB pages, is exactly that — which
  left Celery unable to connect and sign-in returning 500. The official Redis
  image is built to cover 4, 16 and 64 KiB pages alike, so the app now works
  on a Pi 5 with nothing to configure. On such a host the bundled Redis still
  segfaults and is respawned in the log every 20 seconds or so; it is unused
  and the noise is harmless.


  That sidecar is now Valkey rather than Redis, which on a small host is the
  same server for less. Valkey's image applies the identical jemalloc page-size
  patch, so the Pi 5 fix above is unaffected, and it ships redis-server and
  redis-cli as symlinks, so nothing in the app can tell the difference. The
  saving is mostly modules: the Redis 8 entrypoint loads every module it ships
  — RediSearch, RedisJSON, RedisBloom, RedisTimeSeries and VectorSet, about
  29 MB of shared objects — on every wake, with no way to turn it off, and
  Dispatcharr uses none of them. Measured against a running Dispatcharr on
  arm64, the sidecar went from 23 MiB to 5 MiB of container memory, and the
  image from 55 MB to 22 MB.


  Also fixed: the Lazytainer sidecar was never checking for open connections.
  Its ipv4/ipv6 toggles only enable a family when the environment variable is
  present, so leaving them unset — the documented default — silently disabled
  the check, and only packet counting kept the app awake. Setting
  IPV4_DISABLED to "false" turns it back on, so an open but idle connection
  now holds the app up as intended.


  The icon is also redrawn the way the official App Store draws its own:
  square and full-bleed, with the mark inset rather than running to the edge
  and the background opaque rather than transparent.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
