version: "3.7"

services:
  app_proxy:
    environment:
      # Point at Lazytainer, not at the app. Lazytainer owns the network
      # namespace and therefore the address:port the app answers on, and it is
      # the only container here that is always up, so its container name always
      # resolves.
      APP_HOST: mrfyda-dispatcharr_lazytainer_1
      APP_PORT: 9191
      # Dispatcharr has its own login, and the things that make it useful are
      # unauthenticated-by-design endpoints that other software calls: the M3U
      # and EPG URLs, the HDHomeRun emulation Plex/Jellyfin discover, and the
      # /proxy stream URLs a player opens. None of those can carry an Umbrel
      # session cookie, so Umbrel auth in front of them would break every
      # client. Dispatcharr's own account is what protects the UI.
      PROXY_AUTH_ADD: "false"

  # ============================================================================
  # Lazytainer — the always-on gatekeeper
  # ============================================================================
  #
  # It does not proxy anything. It holds a network namespace, counts packets
  # arriving on port 9191 and counts ESTABLISHED sockets on that port, and calls
  # the Docker API to stop the app when both stay quiet and start it again when
  # they don't.
  #
  # ⚠️ That Docker API access is the host's real Docker socket, which is
  # effectively host root. It is why the official Umbrel App Store forbids this
  # and why this app lives in a personal store instead.
  lazytainer:
    image: ghcr.io/vmorganp/lazytainer:sha-919abb2@sha256:c6c76d8534e9d74732e415e92401b3ca37a8274dad7b3496993a8f9def074149
    restart: on-failure
    volumes:
      # Under Portainer this was /data/docker.sock, because Portainer's own
      # containers run in a nested Docker daemon. Here the app runs in
      # umbrelOS' main daemon, so it is the ordinary host path.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      VERBOSE: "false"
    labels:
      # Group name must not contain a dot: Lazytainer parses the group out of
      # the label as the third dot-separated field.
      - "lazytainer.group.dispatcharr.ports=9191"
      # 5 minutes, not the 60s used under Portainer. The app is stopped, not
      # paused, so waking it means a full cold start — Postgres recovery, then
      # migrate, collectstatic, uwsgi and nginx. Sleeping aggressively means
      # paying that repeatedly.
      - "lazytainer.group.dispatcharr.inactiveTimeout=300"
      - "lazytainer.group.dispatcharr.minPacketThreshold=1"
      - "lazytainer.group.dispatcharr.sleepMethod=stop"

  # ============================================================================
  # Redis — a sidecar, because the bundled one cannot start everywhere
  # ============================================================================
  #
  # The all-in-one image runs its own redis-server under uwsgi. That binary's
  # jemalloc is built for 4 KiB pages, so on a host whose pages are larger it
  # prints "<jemalloc>: Unsupported system page size" and segfaults before it
  # binds anything. A Raspberry Pi 5 on Raspberry Pi OS is exactly that host —
  # its rpi-2712 kernel uses 16 KiB pages by default. Nothing then works:
  # Celery never connects, and signing in returns 500, because the token
  # endpoint reads the Django cache.
  #
  # Upstream's answer is to move the Pi onto the 4 KiB kernel — kernel8.img in
  # /boot/firmware/config.txt — and they closed the report on that basis:
  # https://github.com/Dispatcharr/Dispatcharr/issues/620. It does work, but it
  # is a machine-wide change, and it would leave this app installable only by
  # someone willing to re-kernel their box first.
  #
  # The official Redis image has already solved the same problem: it patches
  # the bundled jemalloc with --with-lg-page=16 on every non-x86 architecture,
  # the way Debian builds it, so one binary covers 4, 16 and 64 KiB pages.
  # Pointing the app at that is a change this store can make once, on behalf of
  # everyone who installs it. Redis as its own service is upstream's own
  # modular layout, so this is a supported shape rather than an invention.
  redis:
    image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    restart: on-failure
    depends_on:
      - lazytainer

    # Shares Lazytainer's namespace so the app reaches it at a literal address
    # with no DNS in the way. The app container has no network of its own, so a
    # service name would have to resolve through whatever resolver that
    # namespace ends up with; 127.0.0.1 depends on nothing.
    network_mode: service:lazytainer

    # 6380, not 6379, and that is the point. uwsgi still starts the bundled
    # redis-server and there is no setting here that stops it, so on a 4 KiB
    # host it comes up perfectly well and takes 6379. Sitting beside it on
    # another port means one compose file is right on both kinds of host: the
    # bundled one is simply left unused wherever it happens to run. On a 16 KiB
    # host it keeps segfaulting and being respawned every ~20s, which is noise
    # in the log and nothing more — the app is not talking to it.
    #
    # Nothing is persisted. All of this is a Celery queue, a Django cache and a
    # channels layer, all rebuildable, and writing nothing keeps the container
    # stateless: no data directory to create, no uid to line up with
    # APP_DATA_DIR.
    command: ["redis-server", "--port", "6380", "--timeout", "300", "--save", "", "--appendonly", "no"]

    # Deliberately outside the lazytainer group. It has to be up before the app
    # wakes, and it costs a few MiB at rest.
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Dispatcharr — all-in-one
  # ============================================================================
  server:
    image: ghcr.io/dispatcharr/dispatcharr:0.31.0@sha256:f81924fa3dbfeb463b3908be7e086bf58aacbd2ba56062bfb555ee3a471acf8f
    restart: on-failure

    # Shares Lazytainer's network namespace, so Lazytainer sees every packet
    # meant for this container. It has no address of its own and no DNS name,
    # which is fine: Postgres and Celery are inside this same image, and Redis
    # is the sidecar above, in this same namespace on 6380.
    network_mode: service:lazytainer
    depends_on:
      - lazytainer
      - redis

    labels:
      - "lazytainer.group=dispatcharr"

    volumes:
      # Everything: Postgres cluster at /data/db, the generated Django secret
      # at /data/jwt, logos, recordings, uploads. Losing this is losing the
      # install.
      - ${APP_DATA_DIR}/data:/data

    # No `user:` here on purpose. The image starts as root and drops to
    # PUID:PGID itself — it has to, because it renames the internal account,
    # chowns the Postgres cluster and rewrites nginx's user directive before
    # anything starts. Forcing `user: "1000:1000"` makes the init scripts fail.
    # PUID/PGID default to 1000 anyway, which is what Umbrel owns APP_DATA_DIR
    # as, but they are set explicitly so it stays true if the default changes.
    environment:
      DISPATCHARR_ENV: aio
      PUID: "1000"
      PGID: "1000"
      DISPATCHARR_PORT: "9191"
      DISPATCHARR_LOG_LEVEL: info
      TZ: ${TZ:-UTC}
      # Every Redis client reads these — Celery's broker, the Django cache, the
      # channels layer, and the connection pools in core/utils.py — so this is
      # the whole of pointing the app at the sidecar. uwsgi's own
      # wait_for_redis.py gate reads them too, so startup waits on the Redis
      # that works rather than the one that cannot start.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"

    # The shutdown path stops Postgres, Redis, Celery, uwsgi and nginx in turn
    # and allows itself 8s before force-killing. Docker's default 10s grace
    # period leaves no margin, and Lazytainer triggers this every time the app
    # goes idle rather than only on app updates.
    stop_grace_period: 1m
