releaseNotes: >-
  0.1.4a is packaging only: the icon is now drawn the way the official App
  Store draws its own — square and full-bleed, with the mark inset rather
  than bleeding to the edge. It previously rounded its own corners, which
  umbrelOS then rounded again over transparent ones. The server itself is
  unchanged from 0.1.4.


  Three upstream releases at once. The substance is 0.1.3: the server now
  answers the exchanges a device opens, instead of only driving devices.
  Nodes are subscribed to rather than polled, a device's events arrive as
  node_event, check-ins fill in get_icd_state, update_node hosts an OTA
  Provider cluster, and a camera's WebRTC signalling relays both ways. Real
  hardware then found four bugs that 324 tests had not — among them that
  every write omitted the mandatory TimedRequest, so write_attribute,
  set_acl_entry and set_node_binding had all been refused by the device.


  ⚠️ Read this before updating. That release binds and advertises a real
  Matter port, 5540, rather than the ephemeral one it never listened on.
  Under host networking that is a host port. Anything else still holding
  5540 — matterjs-server, python-matter-server, a Portainer stack — now
  stops this server from starting, rather than letting it advertise a port
  it is not listening on. Stop that one first, or set MATTER_PORT in
  docker-compose.yml.


  0.1.2 publishes the image for amd64 as well as arm64, so this app installs
  on an Intel or AMD Umbrel host for the first time — 0.1.1 was arm64 only.
  0.1.4 is docs only.
