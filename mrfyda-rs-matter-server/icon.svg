<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="rs-matter-server">
  <defs>
    <linearGradient id="petals" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5A623"/>
      <stop offset="0.5" stop-color="#E8557F"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1D2A"/>
      <stop offset="1" stop-color="#0E0F17"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Three petals at 120 degrees, the trefoil motif Matter uses. Drawn here
       rather than reusing the Alliance's certification mark, which would imply
       a certification this server does not have. -->
  <g fill="url(#petals)">
    <g transform="translate(256 262)">
      <path d="M0 -150 C 46 -92, 62 -44, 0 0 C -62 -44, -46 -92, 0 -150 Z" opacity="0.95"/>
      <path d="M0 -150 C 46 -92, 62 -44, 0 0 C -62 -44, -46 -92, 0 -150 Z" opacity="0.95" transform="rotate(120)"/>
      <path d="M0 -150 C 46 -92, 62 -44, 0 0 C -62 -44, -46 -92, 0 -150 Z" opacity="0.95" transform="rotate(240)"/>
      <circle cx="0" cy="0" r="21" fill="#0E0F17"/>
    </g>
  </g>
</svg>
